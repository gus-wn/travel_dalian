<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대련 2박 3일</title>
<style>
@font-face{font-family:"BM Kkubulim";src:url("fonts/BMKkubulim.woff2") format("woff2"),url("fonts/BMKkubulim.woff") format("woff");font-display:swap}
@font-face{font-family:"Chosunilbo_myungjo";src:url("fonts/ChosunilboMyungjo.woff") format("woff");font-display:swap}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a travel-log planner page. Grid paper, a dashed route down the left, pastel dots mark each stop's category. */
:root{
  --paper:#ffffff; --grid:#eef0f2; --line:#dcdfe3; --text:#3b3b3b; --sub:#8b9097; --dash:#a3a8ae; --ink:#3b3b3b; --accent:#6d8db3;
  --c-food:#f2b5b2; --c-night:#f4d08a; --c-shop:#a6d4bd; --c-move:#bdbbe9; --c-massage:#f5c2a4; --c-rest:#b4d4ee;
  --hand:"BM Kkubulim","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Chosunilbo_myungjo","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1e2023; --grid:#282b2f; --line:#3a3e44; --text:#e8e8e6; --sub:#9da2a8; --dash:#6c7279; --ink:#e8e8e6; --accent:#9fbbe0;
  --c-food:#e49e9b; --c-night:#e6c173; --c-shop:#8fc4aa; --c-move:#a9a7dd; --c-massage:#e6ad8d; --c-rest:#9cc2e2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1e2023; --grid:#282b2f; --line:#3a3e44; --text:#e8e8e6; --sub:#9da2a8; --dash:#6c7279; --ink:#e8e8e6; --accent:#9fbbe0;
  --c-food:#e49e9b; --c-night:#e6c173; --c-shop:#8fc4aa; --c-move:#a9a7dd; --c-massage:#e6ad8d; --c-rest:#9cc2e2;
  color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;
  color:var(--text);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
h1,h2{font-family:var(--hand);font-weight:400;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ico{display:none}

/* small controls */
.btn,.chip-btn,.jump a{font-family:var(--hand);font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:3px 13px;text-decoration:none;line-height:1.6}
.btn:hover,.chip-btn:hover,.jump a:hover{border-color:var(--sub)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.warn{background:var(--c-food);border-color:var(--c-food);color:#3b3b3b}
.chip-btn{border-style:dashed;color:var(--sub)}
.chip-btn:hover{color:var(--text)}

.modebar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-family:var(--hand);font-size:14px;color:var(--sub)}
.modebar .pill{display:inline-flex;align-items:center;gap:6px}
.modebar .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.modebar .dot.on{background:var(--c-shop)}

/* header */
.cover{display:flex;flex-direction:column;gap:0}
.pass{display:flex;flex-direction:column}
.pass-top{display:flex;flex-direction:column;gap:6px;padding-bottom:14px}
.eyebrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--hand);font-size:15px;color:var(--sub);letter-spacing:.06em}
.eyebrow .logo{display:inline-flex;align-items:center;gap:8px;color:var(--text);font-size:18px}
.eyebrow .logo svg{width:22px;height:22px;stroke:var(--sub);fill:none;stroke-width:1.4}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;letter-spacing:0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.pass h1{font-size:clamp(30px,8vw,42px);line-height:1.2;margin-top:8px}
.pass-sub{color:var(--sub);font-size:14px}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.leg{display:flex;flex-direction:column;gap:0;min-width:0}
.leg .code{font-family:var(--hand);font-size:13px;color:var(--sub)}
.leg .route{font-weight:700}
.leg .when{font-family:var(--hand);font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.leg .delay{font-size:12px;color:var(--sub)}
.stay{padding-top:10px;font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stay b{font-family:var(--hand);font-weight:400;color:var(--text)}

.mapcard{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px}
.mapcard a{display:block;line-height:0}
.mapcard img{width:100%;height:auto;display:block;border-radius:3px}
.mapcard figcaption{font-family:var(--hand);font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:baseline;padding:0 2px}
.mapcard figcaption span{font-size:12px}

.jump{display:flex;gap:8px;flex-wrap:wrap}

/* day */
.day{display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.day-head{display:flex;flex-direction:column;gap:0}
.day-head .slash{font-family:var(--hand);color:var(--sub);font-size:16px;line-height:1}
.day-head .row{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--text);padding-bottom:4px}
.day-head h2{font-size:26px}
.day-head .date{font-family:var(--hand);color:var(--sub);font-size:15px}
.timeline{display:flex;flex-direction:column;gap:14px;position:relative}
.timeline::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;border-left:2px dashed var(--dash)}

.stop{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;position:relative}
.stop::before{content:"";position:absolute;left:0;top:16px;width:12px;height:12px;border-radius:50%;background:var(--dot,var(--line));box-shadow:0 0 0 3px var(--paper)}
.stop[data-t="식사"]{--dot:var(--c-food)} .stop[data-t="야경"]{--dot:var(--c-night)} .stop[data-t="쇼핑"]{--dot:var(--c-shop)}
.stop[data-t="이동"]{--dot:var(--c-move)} .stop[data-t="마사지"]{--dot:var(--c-massage)} .stop[data-t="휴식"]{--dot:var(--c-rest)}
.stop-time{padding:10px 0 0 22px;font-family:var(--hand);font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card-title{font-weight:700;font-size:16px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--hand);font-weight:400;font-size:13px;color:var(--sub);margin-right:8px;vertical-align:1px}
.tag i,.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line)}
[data-t="식사"] i{background:var(--c-food)} [data-t="야경"] i{background:var(--c-night)} [data-t="쇼핑"] i{background:var(--c-shop)}
[data-t="이동"] i{background:var(--c-move)} [data-t="마사지"] i{background:var(--c-massage)} [data-t="휴식"] i{background:var(--c-rest)}
.card-note{color:var(--sub);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.tools{display:flex;gap:2px;flex-shrink:0}
.icon-btn{border:0;background:none;padding:0 6px;font-size:13px;font-family:var(--hand);color:var(--sub);border-radius:4px}
.icon-btn:hover{color:var(--text);background:var(--grid)}
.icon-btn.danger:hover{color:#c0605b}

/* links + photos */
.foot{border-top:1px dashed var(--line);padding-top:10px;margin-top:2px;display:flex;flex-direction:column;gap:8px}
.links{display:flex;flex-direction:column;gap:4px}
.link-row{display:flex;gap:8px;align-items:center;min-width:0}
.link-row a{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;text-decoration:none}
.link-row a:hover{text-decoration:underline}
.link-row .n{font-family:var(--hand);font-size:11px;color:#fff;background:#03c75a;border-radius:3px;padding:0 5px;flex-shrink:0}
.link-row .n.g{background:#3b82e0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--grid);border-radius:4px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:4px;font-size:12px;padding:0 6px}
.photo.broken::after{content:"사진을 불러오지 못했어요";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-family:var(--hand);font-size:13px;color:var(--sub)}
.photo.broken img{opacity:0}
.add-row{display:flex;gap:6px;flex-wrap:wrap}
.add-row .chip-btn{font-size:13px;padding:1px 11px}

/* forms */
.form{display:flex;flex-direction:column;gap:8px}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form label{font-family:var(--hand);font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px}
.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:7px 10px;width:100%;font-family:var(--body);font-size:15px}
.form textarea{min-height:64px;resize:vertical}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.confirm{background:var(--grid);border-radius:6px;padding:8px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.add-stop{align-self:flex-start;margin-left:72px}
.dropzone{border:1.5px dashed var(--dash);border-radius:8px;padding:14px;text-align:center;font-family:var(--hand);font-size:14px;color:var(--sub);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.card.dropping{border-color:var(--accent);box-shadow:0 0 0 3px var(--grid)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.panel strong{font-family:var(--hand);font-weight:400;font-size:18px}
.panel ol{margin:0;padding-left:20px;color:var(--sub);font-size:13px;display:flex;flex-direction:column;gap:2px}
.panel code{font-size:12px;background:var(--grid);padding:0 4px;border-radius:3px}

.refs{display:flex;flex-direction:column;gap:14px}
.refs h2{font-size:22px;border-bottom:1px solid var(--text);padding-bottom:4px}

.printrow{display:flex;justify-content:center}
.printrow .btn{font-size:15px;padding:6px 20px}
.print-only{display:none}
.status{font-family:var(--hand);font-size:13px;color:var(--sub);text-align:center;margin:0}
.err{color:#c0605b}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar-box{pointer-events:auto;background:var(--paper);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.08);
  display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 10px 8px 18px;font-family:var(--hand);font-size:14px}
.savebar .btn{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.savebar .btn.ghost{background:var(--paper);color:var(--text);border-color:var(--line)}

@media (max-width:480px){
  .stop{grid-template-columns:56px 1fr;gap:8px}
  .stop-time{font-size:14px;padding-left:20px}
  .add-stop{margin-left:64px}
  .legs{grid-template-columns:1fr;gap:10px}
}

/* print: A5 travel-log booklet */
@page{size:A5;margin:13mm 11mm 15mm}
@page{@bottom-center{content:counter(page);font-size:9pt;color:#8b9097}}
@page :first{@bottom-center{content:none}}
@media print{
  html:root:not(#x){--paper:#ffffff;--grid:#eef0f2;--line:#d3d6da;--text:#3b3b3b;--sub:#7d828a;--dash:#a3a8ae;--ink:#3b3b3b;--accent:#5b7ba3;
    --c-food:#f2b5b2;--c-night:#f4d08a;--c-shop:#a6d4bd;--c-move:#bdbbe9;--c-massage:#f5c2a4;--c-rest:#b4d4ee;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0;font-size:10.5pt;line-height:1.55;background-size:4mm 4mm}
  .wrap{max-width:none;gap:0}
  .modebar,.panel,.jump,.add-row,.add-stop,.tools,.savebar,.printrow,.status,.confirm,form,.dropzone,.photo button,.link-row .icon-btn,.mapcard figcaption span{display:none!important}
  .print-only{display:block}
  .cover{order:-2;break-after:page;min-height:178mm;justify-content:center;gap:8mm}
  .cover .book-label{font-family:var(--hand);font-size:11pt;color:var(--sub);text-align:center;letter-spacing:.1em}
  .cover .book-foot{font-family:var(--hand);font-size:9.5pt;color:var(--sub);text-align:center}
  .pass h1{font-size:26pt}
  .mapcard{order:-1;break-after:page;border:0;padding:0;background:none}
  .mapcard figcaption{order:-1;font-size:12pt;padding-bottom:3mm}
  .day,.refs{break-before:page}
  .day-head h2{font-size:18pt}
  .stop,.card,.photo{break-inside:avoid}
  .timeline{gap:4mm}
  .card{padding:3mm 4mm}
  .card-title{font-size:11pt}
  .card-note{font-size:9.5pt}
  .foot:not(:has(.links,.photos)){display:none}
  .link-row a{white-space:normal;text-decoration:none}
  .link-row a::after{content:"  " attr(href);display:block;font-size:7.5pt;color:var(--sub);word-break:break-all}
  .photos{grid-template-columns:repeat(3,1fr)}
}
.savebar-box.bad{border-color:#e0a09c;border-radius:14px;max-width:560px}
.save-err{color:#c0605b;flex-basis:100%;text-align:center;font-size:14px}
.savebar-box.ok{padding:8px 18px}
.checklist{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ck-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ck-head h2{font-size:22px}
.ck-count{font-family:var(--hand);color:var(--sub);font-size:15px;font-variant-numeric:tabular-nums}
.ck-bar{height:6px;background:var(--grid);border-radius:999px;overflow:hidden}
.ck-bar i{display:block;height:100%;background:var(--c-shop);border-radius:999px;transition:width .2s}
.ck-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px 18px}
.ck-list li{display:flex;align-items:center;gap:6px;min-width:0;border-bottom:1px dashed var(--line);padding:5px 0}
.ck-list label{display:flex;align-items:flex-start;gap:9px;flex:1;min-width:0;cursor:pointer;font-size:14px;line-height:1.5}
.ck-list label span{overflow-wrap:anywhere}
.ck{appearance:none;-webkit-appearance:none;flex-shrink:0;width:17px;height:17px;margin:2px 0 0;border:1.5px solid var(--dash);border-radius:4px;background:var(--paper);display:grid;place-content:center;cursor:pointer}
.ck:checked{background:var(--c-shop);border-color:var(--c-shop)}
.ck:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck-list li.done span{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--dash)}
.ck-add{display:flex;gap:8px}
.ck-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:6px 10px;font-family:var(--body);font-size:14px}
@media (prefers-reduced-motion:reduce){.ck-bar i{transition:none}}
@media print{
  .checklist{break-after:page;border:0;padding:0;background:none}
  .ck-bar,.ck-add,.ck-list .icon-btn{display:none!important}
  .ck-list{grid-template-columns:1fr}
}
.mapbox{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.map-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.map-head h2{font-size:22px}
.map-filter{display:flex;gap:6px;flex-wrap:wrap}
.map-filter .chip-btn{border-style:solid;font-size:13px;padding:1px 11px}
.map-filter .chip-btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#map-slot{position:relative}
#map{height:min(62vh,380px);border-radius:4px;border:1px solid var(--line);background:var(--grid);z-index:0}
#map.tapping{cursor:crosshair;outline:3px dashed var(--c-massage);outline-offset:3px}
.map-fallback{width:100%;border-radius:4px;display:block}
.map-note{margin:0;font-size:13px;color:var(--sub)}
.map-note.tap{background:var(--grid);border-radius:6px;padding:6px 10px;color:var(--text);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.map-foot{margin:0;font-size:12px;text-align:right}
.pin-wrap{background:none;border:0}
.pin{display:flex;align-items:center;justify-content:center;width:34px;height:22px;border-radius:999px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font-family:var(--hand);font-size:12px;color:#3b3b3b}
.pin b{font-weight:400}
.leaflet-container{font-family:var(--body)}
.leaflet-popup-content{margin:10px 12px}
.pop{display:flex;flex-direction:column;gap:3px;min-width:160px}
.pop-meta{font-family:var(--hand);font-size:12px;color:#8b9097}
.pop strong{font-size:14px;line-height:1.4;color:#3b3b3b}
.pop a{font-size:13px}
.chip-btn.loc-on{border-style:solid;color:var(--text)}
.loc-results{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto}
.loc-pick{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-size:14px;display:flex;flex-direction:column}
.loc-pick:hover{border-color:var(--sub)}
.loc-pick small{color:var(--sub);font-size:12px}
@media print{.mapbox{order:-1;break-after:page;border:0;padding:0}.map-filter,.map-note,.map-foot,.leaflet-control-container{display:none!important}#map{height:150mm}}
.loc-warn{font-size:12.5px;color:#b0625c;background:var(--grid);border-radius:6px;padding:4px 8px}
.pin-wrap{width:0!important;height:0!important}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 7px));display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  background:#fff;color:#3b3b3b;border:1px solid #d3d6da;border-radius:999px;padding:2px 9px 2px 6px;font-family:var(--hand);font-size:13px;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.18);width:auto;height:auto}
.pin i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pin::after{content:"";position:absolute;left:50%;bottom:-7px;width:2px;height:7px;background:#8b9097;transform:translateX(-50%)}
.pin::before{content:"";position:absolute;left:50%;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#3b3b3b;transform:translateX(-50%)}
.loc-wait{font-size:12.5px;color:var(--text);background:var(--grid);border-radius:6px;padding:4px 8px;display:flex;align-items:center;gap:7px}
.spin{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--sub);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

<script>
(function(){
  /* ── 저장소 설정 ── github.io 주소에서 자동으로 읽고, 아니면 아래 값을 씁니다 */
  var OWNER="gus-wn", REPO="travel_dalian", BRANCH="main", FILE="data.json";
  if(/\.github\.io$/.test(location.hostname)){
    OWNER=location.hostname.split(".")[0];
    var seg=location.pathname.split("/").filter(Boolean)[0];
    if(seg && !/\.html?$/.test(seg)) REPO=seg;
  }
  var API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/";
  var TK="dalian-gh-token", LS="dalian-gh-draft";

  var TAGS=["이동","식사","마사지","야경","휴식","쇼핑"];
  var saved=null, state=null, sha=null, token=null, dirty=false, saving=false, msg="", errMsg="", saveErr="", toast="";
  var ui={edit:null,confirm:null,addLink:null,linkKind:"web",panel:false};
  var localImg={}; /* 방금 올린 사진: GitHub Pages가 갱신되기 전까지 화면에 바로 보이게 */
  try{token=localStorage.getItem(TK);}catch(e){}

  var $app=document.getElementById("app");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function uid(){return Math.random().toString(36).slice(2,9);}
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function safeUrl(u){try{var x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:"";}catch(e){return "";}}
  function isNaver(u){return /naver\.(com|me)/.test(u);}
  function host(u){try{return new URL(u).hostname;}catch(e){return "";}}
  function isMap(l){return l.kind==="map"||/(^|\.)amap\.com$|gaode\.com$/.test(host(l.url));}
  function sortKey(t){var m=/^(\d{1,2}):(\d{2})/.exec(t||"");if(m)return +m[1]*60+ +m[2];if(/오전|아침/.test(t))return 540;if(/오후|점심/.test(t))return 780;if(/저녁|밤/.test(t))return 1140;return 1500;}
  function findItem(id){for(var i=0;i<state.days.length;i++){var d=state.days[i];for(var j=0;j<d.items.length;j++)if(d.items[j].id===id)return {d:d,it:d.items[j]};}return null;}
  function target(id){if(id==="refs")return state.refs;var f=findItem(id);return f&&f.it;}
  /* ── 도트 아이콘 (8x8) ── #=본색, +=밝은색 */
  var ICONS={
    "이동":["...##...","...##...","..####..","########","########","...##...","..####..","..#..#.."],
    "식사":["..#.#...","...#.#..","........","########","#++++++#",".#++++#.","..####..","........"],
    "마사지":["........",".##..##.","#+######","########","########",".######.","..####..","...##..."],
    "야경":["...###..","..##....",".##...#.",".##..###",".##...#.","..##....","...###..","........"],
    "휴식":["..#.#...","...#.#..","........","######..","#++++###","#++++#.#","#++++###",".####..."],
    "쇼핑":["..####..",".#....#.",".#....#.","########","#++++++#","#++++++#","#++++++#","########"],
    plane:["........","....#...","....##..","########","########","....##..","....#...","........"],
    book:["........","##.##.##","#+#+#+##","#+#+#+##","#+#+#+##","#+#+#+##","##.##.##","........"],
    pin:["..####..",".######.","##++####","##++####",".######.","..####..","...##...","...##..."]
  };
  function px(name,cls){var g=ICONS[name];if(!g)return "";var r="";
    g.forEach(function(row,y){for(var x=0;x<8;x++){var c=row[x];if(c==="#")r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="currentColor"/>';else if(c==="+")r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="currentColor" fill-opacity=".45"/>';}});
    return '<svg class="ico'+(cls?" "+cls:"")+'" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';}
  function canEdit(){return !!token;}
  function imgSrc(p){return localImg[p.path]||p.path||p.url;}

  /* ── base64 (한글 포함) ── */
  function b64enc(str){var b=new TextEncoder().encode(str),s="";for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
  function b64dec(b64){var bin=atob(b64.replace(/\n/g,"")),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}

  function gh(path,opts){
    opts=opts||{};var h={"Accept":"application/vnd.github+json"};
    if(token)h.Authorization="Bearer "+token;
    if(opts.body)h["Content-Type"]="application/json";
    return fetch(API+path+(opts.method?"":"?ref="+BRANCH+"&t="+Date.now()),{method:opts.method||"GET",headers:h,body:opts.body,cache:"no-store"});
  }

  /* ── 불러오기 ── 편집 모드면 GitHub API로 최신본, 아니면 사이트의 data.json */
  async function load(){
    var data=null;
    if(token){
      try{var r=await gh(FILE);
        if(r.ok){var j=await r.json();data=JSON.parse(b64dec(j.content));sha=j.sha;}
        else if(r.status===401){errMsg="저장 키가 맞지 않거나 만료됐어요. 편집 모드를 끄고 새 키를 넣어 주세요.";}
        else if(r.status===404){errMsg="저장소 "+OWNER+"/"+REPO+"에서 data.json을 찾지 못했어요. 키를 만들 때 이 저장소를 골랐는지 확인해 주세요.";}
      }catch(e){errMsg="GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";}
    }
    if(!data){try{var r2=await fetch(FILE+"?t="+Date.now(),{cache:"no-store"});if(r2.ok)data=await r2.json();}catch(e){}}
    if(!data)data=JSON.parse(document.getElementById("fallback").textContent);
    saved=data;state=clone(saved);
    loadStatus();
    try{var d=localStorage.getItem(LS);if(d){var p=JSON.parse(d);
      if(p&&p.state&&JSON.stringify(p.state)!==JSON.stringify(saved)){
        if(p.base!==JSON.stringify(saved))mergeNew(p.state,saved); /* 저장 못 한 수정본 + 그사이 새로 생긴 링크·사진 */
        state=p.state;dirty=true;msg="저장하지 못했던 수정 내용을 다시 불러왔어요. 아래 '저장'을 눌러 주세요.";}}}catch(e){}
    render();
  }
  /* ── 고덕 링크 → 위치 자동 찾기 (GitHub가 대신 링크를 열어 좌표를 찾음) ── */
  var amapStatus=null,pollTimer=null,pollLeft=0,waitIds=[];
  async function loadStatus(){
    try{var t=null;
      if(token){var r=await gh("amap-status.json");if(r.ok)t=b64dec((await r.json()).content);}
      else{var r2=await fetch("amap-status.json?t="+Date.now(),{cache:"no-store"});if(r2.ok)t=await r2.text();}
      amapStatus=t?JSON.parse(t):null;render();
    }catch(e){}
  }
  function firstMapLink(it){var l=(it.links||[]).filter(function(x){return isMap(x);})[0];return l?l.url:null;}
  function unresolvedFor(it){
    if(!amapStatus||!amapStatus.unresolved)return null;var u=firstMapLink(it);
    return amapStatus.unresolved.filter(function(x){return x.id===it.id&&x.url===u;})[0]||null;
  }
  function needsResolve(st){
    var n=0;st.days.forEach(function(d){d.items.forEach(function(it){var u=firstMapLink(it);if(!u)return;
      if(it.loc&&!it.loc.src)return; if(it.loc&&it.loc.from===u)return; if(unresolvedFor(it))return; n++;});});return n;
  }
  function coordsFromUrl(u){
    var t;try{t=decodeURIComponent(decodeURIComponent(u));}catch(e){t=u;}
    var m=t.match(/[?&#]p=[^,&]*,(\d{2}\.\d+),(\d{3}\.\d+)/);if(m)return ok(+m[1],+m[2]);
    m=t.match(/(?:position|location|lnglat|center|dest|to)=(\d{3}\.\d+),(\d{2}\.\d+)/);if(m)return ok(+m[2],+m[1]);
    m=t.match(/[?&]q=(\d{2}\.\d+),(\d{3}\.\d+)/);if(m)return ok(+m[1],+m[2]);
    return null;
    function ok(lat,lng){return (lat>38.5&&lat<39.8&&lng>120.8&&lng<122.8)?{lat:+lat.toFixed(6),lng:+lng.toFixed(6)}:null;}
  }
  function adoptAutoLocs(dst,src){ /* 그사이 GitHub가 찾아 둔 위치를 내 수정본에도 넣기 */
    var map={};src.days.forEach(function(d){d.items.forEach(function(it){map[it.id]=it;});});
    dst.days.forEach(function(d){d.items.forEach(function(it){var r=map[it.id];
      if(r&&r.loc&&r.loc.src==="amap"&&(!it.loc||it.loc.src==="amap")&&r.loc.from===firstMapLink(it))it.loc=r.loc;});});
  }
  function startPoll(){
    if(!token)return;clearInterval(pollTimer);pollLeft=18;
    pollTimer=setInterval(async function(){
      if(--pollLeft<0||dirty){clearInterval(pollTimer);if(pollLeft<0){msg="고덕 링크 위치 찾기가 늦어지고 있어요. 잠시 뒤 새로고침해 주세요.";render();}return;}
      try{var r=await gh(FILE);if(!r.ok)return;var j=await r.json();if(j.sha===sha)return;
        var remote=JSON.parse(b64dec(j.content));if(dirty)return;
        saved=remote;state=clone(remote);sha=j.sha;await loadStatus();
        var got=waitIds.filter(function(id){var f=findItem(id);return f&&f.it.loc;});
        if(got.length){waitIds=waitIds.filter(function(id){return got.indexOf(id)<0;});setTimeout(function(){focusMarker(got[0],false);},50);}
        if(!needsResolve(state)){clearInterval(pollTimer);waitIds=[];
          var bad=amapStatus&&amapStatus.unresolved?amapStatus.unresolved.length:0;
          msg="";toast="고덕 링크에서 위치를 찾아 지도에 핀을 찍었어요!"+(bad?" (못 찾은 곳 "+bad+"곳은 카드에 표시)":"");setTimeout(function(){toast="";render();},6000);}
        render();
      }catch(e){}
    },7000);
  }
  function mergeNew(dst,src){
    adoptAutoLocs(dst,src);
    if(src.checklist){dst.checklist=dst.checklist||[];src.checklist.forEach(function(c){if(!dst.checklist.some(function(x){return x.id===c.id;}))dst.checklist.push(c);});}
    var map={};dst.days.forEach(function(d){d.items.forEach(function(it){map[it.id]=it;});});map.refs=dst.refs;

  /* ── 지도 (고덕 바탕지도 + Leaflet) ── 좌표는 고덕 기준(GCJ-02) */
  var PI=Math.PI,EA=6378245.0,EE=0.00669342162296594323;
  function tLat(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r;}
  function tLng(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r;}

  function parseCoords(q){

    h+=mapSectionHTML();
    if(errMsg)h+='<p class="status err">'+esc(errMsg)+'</p>';
    h+='<section class="cover"><p class="print-only book-label">TRAVEL LOG · 대련 여행 수첩</p>'+'<header class="pass"><div class="pass-top"><span class="eyebrow"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>TRAVEL LOG</span><span class="legend">'+TAGS.map(function(t){return '<span data-t="'+t+'"><i></i>'+t+'</span>';}).join("")+'</span></span><h1>'+esc(t.title)+'</h1><span class="pass-sub">'+esc(t.sub)+'</span></div>'+
      '<div class="legs">'+state.flights.map(function(f,i){return '<div class="leg"><span class="code">'+(i?"오는편":"가는편")+' · '+esc(f.code)+'</span><span class="route">'+esc(f.route)+'</span><span class="when">'+esc(f.when)+'</span>'+(f.delay?'<span class="delay">'+esc(f.delay)+'</span>':'')+'</div>';}).join("")+'</div>'+
      '<div class="stay"><b>숙소</b> '+esc(t.stay)+'</div></header><p class="print-only book-foot">'+esc(new Date().toLocaleDateString("ko-KR"))+' 출력</p></section>';
    h+='<nav class="jump" aria-label="날짜 이동">'+state.days.map(function(d){return '<a href="#'+d.id+'">'+esc(d.label)+' · '+esc(d.date)+'</a>';}).join("")+'<a href="#refs">참고 링크</a></nav>';
    state.days.forEach(function(d){
      d.items.sort(function(a,b){return sortKey(a.time)-sortKey(b.time);});
      h+='<section class="day" id="'+d.id+'"><div class="day-head"><span class="slash">/</span><div class="row"><h2>Day '+(state.days.indexOf(d)+1)+'</h2><span class="date">'+esc(d.date)+' · '+esc(d.label)+'</span></div></div><div class="timeline">';
      h+=d.items.map(function(it){return stopHTML(it,d);}).join("");
      if(canEdit())h+=ui.edit==="new-"+d.id?'<div class="stop"><div class="stop-time">새 일정</div>'+editForm(null,d.id)+'</div>':'<button class="chip-btn add-stop" data-act="new" data-id="'+d.id+'">+ '+esc(d.label)+' 일정 추가</button>';
      h+='</div></section>';
    });
    h+='<section class="refs" id="refs"><h2>참고 링크 · 사진</h2><div class="card">'+(footHTML("refs",state.refs)||'<span class="card-note">아직 없어요.</span>')+'</div></section>';
    h+='<div class="printrow"><button class="btn primary" data-act="print">PDF로 저장 (책 모양)</button></div>';
    h+='<p class="status" id="ver" style="opacity:.6"></p>';
    h+='<p class="status">'+esc(msg||(canEdit()?"수정한 뒤 아래 '저장'을 누르면 GitHub에 기록돼요.":"보기 모드예요. 수정하려면 위의 '편집하기'를 눌러 주세요."))+'</p></div>';
    if(dirty&&canEdit())h+='<div class="savebar" role="status"><div class="savebar-box'+(saveErr?' bad':'')+'">'+(saveErr?'<span class="save-err">'+esc(saveErr)+'</span>':'<span>저장하지 않은 변경사항이 있어요</span>')+'<button class="btn ghost" data-act="discard">되돌리기</button><button class="btn" data-act="save"'+(saving?" disabled":"")+'>'+(saving?"저장 중…":"저장")+'</button></div></div>';
    if(toast&&!dirty)h+='<div class="savebar" role="status"><div class="savebar-box ok"><span>'+esc(toast)+'</span></div></div>';
    h+='<input type="file" id="photo-input" accept="image/*" multiple hidden>';
    var keepY=window.scrollY;$app.innerHTML=h;mountMap();if(Math.abs(window.scrollY-keepY)>2)window.scrollTo(0,keepY); /* 다시 그려도 보던 위치 유지 */
    var vEl=document.getElementById("ver");if(vEl)vEl.textContent="버전 10.26-3";
  }
  function focusFirst(){
    var el=$app.querySelector('form[data-form="stop"] input,form[data-form="link"] input,form[data-form="photo-url"] input,form[data-form="token"] input,form[data-form="loc-search"] input');
    if(!el)return;el.focus({preventScroll:true});
    var f=el.closest("form");if(f)f.scrollIntoView({block:"nearest"});
  }

  /* ── 클릭 ── */
  var photoOwner=null;
  $app.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;
    var a=b.dataset.act,id=b.dataset.id;
    if(!canEdit()&&/^(add-(link|map|photo|loc)|loc-tap)$/.test(a)){ui={edit:null,confirm:null,addLink:null,panel:true};msg="";errMsg="추가하려면 먼저 편집 모드를 켜 주세요.";render();scrollTo({top:0,behavior:"smooth"});var t=document.getElementById("tok");if(t)t.focus({preventScroll:true});return;}
    if(a==="panel"){ui.panel=true;render();focusFirst();}
    else if(a==="logout"){try{localStorage.removeItem(TK);}catch(err){}token=null;sha=null;errMsg="";msg="편집 모드를 껐어요.";render();}
    else if(a==="edit"){ui={edit:id,confirm:null,addLink:null};render();focusFirst();}
    else if(a==="new"){ui={edit:"new-"+id,confirm:null,addLink:null};render();focusFirst();}
    else if(a==="cancel"){e.preventDefault();ui={edit:null,confirm:null,addLink:null,panel:false,mapDay:ui.mapDay};render();}
    else if(a==="ask-del"){ui={edit:null,confirm:id,addLink:null};render();}
    else if(a==="del-stop"){state.days.forEach(function(d){d.items=d.items.filter(function(x){return x.id!==id;});});ui.confirm=null;markDirty();}
    else if(a==="add-link"||a==="add-map"){ui={edit:null,confirm:null,addLink:id,linkKind:a==="add-map"?"map":"web"};render();focusFirst();}
    else if(a==="del-link"){target(id).links.splice(+b.dataset.i,1);markDirty();}
    else if(a==="del-photo"){target(id).photos.splice(+b.dataset.i,1);markDirty();}
    else if(a==="add-photo"){ui={edit:null,confirm:null,addLink:null,addPhoto:id};render();focusFirst();}
    else if(a==="pick-photo"){photoOwner=id;document.getElementById("photo-input").click();}
    else if(a==="print")doPrint();
    else if(a==="map-day"){ui.mapDay=id;render();}
    else if(a==="add-loc"){ui={edit:null,confirm:null,addLink:null,addLoc:id,mapDay:ui.mapDay};render();focusFirst();}
    else if(a==="show-loc"){focusMarker(id,true);}
    else if(a==="loc-pick"){var rr=searchRes[id].items[+b.dataset.i];target(id).loc={lat:rr.lat,lng:rr.lng};delete searchRes[id];ui.addLoc=null;msg="위치를 넣었어요. '저장'을 눌러야 남아요.";markDirty();focusMarker(id,false);}
    else if(a==="loc-clear"){delete target(id).loc;ui.addLoc=null;markDirty();}
    else if(a==="loc-tap"){tapFor=id;ui.addLoc=null;render();var sec=document.getElementById("map-sec");if(sec)sec.scrollIntoView({behavior:"smooth",block:"start"});}
    else if(a==="tap-cancel"){tapFor=null;render();}
    else if(a==="ck-del"){state.checklist=state.checklist.filter(function(c){return c.id!==id;});markDirty();}
    else if(a==="save")save();
    else if(a==="discard"){state=clone(saved);dirty=false;clearDraft();render();}
  });

  /* ── 폼 ── */
  $app.addEventListener("submit",function(e){
    e.preventDefault();var f=e.target,fd=new FormData(f),id=f.dataset.id;
    if(f.dataset.form==="token"){
      var tk=(fd.get("tok")||"").trim();if(!tk)return;
      verifyToken(tk);return;
    }
    if(f.dataset.form==="loc-search"){
      var q=(fd.get("q")||"").trim();if(!q)return;
      var c=parseCoords(q);
      if(c){target(id).loc=c;delete searchRes[id];ui.addLoc=null;msg="좌표로 위치를 넣었어요. '저장'을 눌러야 남아요.";markDirty();focusMarker(id,false);return;}
      searchPlace(id,q);return;
    }
    if(f.dataset.form==="ck-add"){var tx=(fd.get("text")||"").trim();if(!tx)return;state.checklist.push({id:uid(),text:tx,done:false});markDirty();var ni=document.getElementById("ck-new");if(ni)ni.focus();return;}
    if(f.dataset.form==="stop"){
      var v={time:(fd.get("time")||"").trim(),tag:fd.get("tag"),title:(fd.get("title")||"").trim(),note:(fd.get("note")||"").trim()};
      if(!v.title)return;
      if(id.indexOf("new-")===0){var d=state.days.filter(function(x){return x.id===f.dataset.day;})[0];d.items.push(Object.assign({id:uid()},v,{links:[],photos:[]}));}
      else Object.assign(findItem(id).it,v);
      ui.edit=null;markDirty();
    }else if(f.dataset.form==="link"){
      var raw=(fd.get("url")||"").trim(),m=raw.match(/https?:\/\/[^\s，。]+/),url=safeUrl(m?m[0]:raw);
      if(!url){msg="링크는 https:// 로 시작하는 주소를 넣어 주세요.";render();return;}
      var ln={url:url,label:(fd.get("label")||"").trim()};if(f.dataset.kind==="map")ln.kind="map";
      target(id).links.push(ln);ui.addLink=null;msg="";
      if(id!=="refs"&&isMap(ln)){var tg=target(id),cc=coordsFromUrl(url);
        if(cc&&(!tg.loc||tg.loc.src==="amap")){tg.loc={lat:cc.lat,lng:cc.lng,src:"amap",from:url};msg="링크에 좌표가 있어서 바로 지도에 찍었어요.";}
        else if(!tg.loc||tg.loc.src==="amap"){waitIds.push(id);markDirty();msg="";save();return;}}
      markDirty();
    }else if(f.dataset.form==="photo-url"){
      var pr=(fd.get("url")||"").trim(),pm=pr.match(/https?:\/\/\S+/),pu=safeUrl(pm?pm[0]:pr);
      if(!pu){msg="사진 주소는 https:// 로 시작해야 해요.";render();return;}
      target(id).photos.push({url:pu,cap:""});ui.addPhoto=null;msg="사진을 붙였어요. '저장'을 눌러야 남아요.";markDirty();
    }
  });

  /* ── 사진: 줄여서 저장소 photos/ 폴더에 올림 ── */
  function shrink(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.82));};
    img.onerror=function(){rej(new Error("이미지 파일이 아니에요"));};img.src=u;});}
  $app.addEventListener("change",function(e){
    if(!e.target.classList.contains("ck"))return;
    var c=state.checklist.filter(function(x){return x.id===e.target.dataset.id;})[0];if(!c)return;
    c.done=e.target.checked;markDirty();
  });
  $app.addEventListener("change",async function(e){
    if(e.target.id!=="photo-input"||!photoOwner)return;
    var files=[].slice.call(e.target.files),owner=photoOwner;photoOwner=null;e.target.value="";uploadFiles(files,owner);
  });
  async function uploadFiles(files,owner){
    files=files.filter(function(f){return /^image\//.test(f.type);});
    if(!files.length){msg="사진 파일(jpg, png 등)만 넣을 수 있어요.";render();return;}
    ui.addPhoto=null;msg="사진 올리는 중… (0/"+files.length+")";render();var ok=0,fail="";
    for(var i=0;i<files.length;i++){
      try{
        var dataUrl=await shrink(files[i]),path="photos/"+Date.now()+"-"+uid()+".jpg";
        var r=await gh(path,{method:"PUT",body:JSON.stringify({message:"사진 추가",content:dataUrl.split(",")[1],branch:BRANCH})});
        if(!r.ok)throw new Error(r.status===401||r.status===403?"저장 키 권한을 확인해 주세요":"업로드 실패 ("+r.status+")");
        localImg[path]=dataUrl;target(owner).photos.push({path:path,cap:files[i].name});ok++;
        msg="사진 올리는 중… ("+ok+"/"+files.length+")";render();
      }catch(err){fail=err.message;}
    }
    msg=fail?"사진 "+ok+"장 올림. 나머지는 실패했어요: "+fail:"사진 "+ok+"장 올렸어요. '저장'을 눌러야 일정에 붙어요.";
    markDirty();
  }

  /* ── 끌어다 놓기: 카드 아무 곳에나 사진 파일이나 웹 이미지를 놓으면 추가 ── */
  function ownerOf(el){var f=el&&el.closest&&el.closest("[data-owner]");return f?f.dataset.owner:null;}
  var hot=null;
  function setHot(el){if(hot&&hot!==el)hot.classList.remove("dropping");hot=el;if(el)el.classList.add("dropping");}
  $app.addEventListener("dragover",function(e){
    var card=e.target.closest&&e.target.closest(".card");if(!card||!card.querySelector("[data-owner]"))return;
    e.preventDefault();e.dataTransfer.dropEffect="copy";setHot(card);
  });
  $app.addEventListener("dragleave",function(e){if(hot&&!hot.contains(e.relatedTarget))setHot(null);});
  $app.addEventListener("drop",function(e){
    var card=e.target.closest&&e.target.closest(".card");if(!card)return;
    var owner=ownerOf(card.querySelector("[data-owner]"));setHot(null);if(!owner)return;e.preventDefault();
    if(!canEdit()){ui={edit:null,confirm:null,addLink:null,panel:true};errMsg="사진을 넣으려면 먼저 편집 모드를 켜 주세요.";render();scrollTo({top:0,behavior:"smooth"});return;}
    var files=[].slice.call(e.dataTransfer.files||[]);
    if(files.length){uploadFiles(files,owner);return;}
    var html=e.dataTransfer.getData("text/html")||"",m=html.match(/<img[^>]+src="([^"]+)"/i);
    var u=safeUrl(m?m[1].replace(/&amp;/g,"&"):(e.dataTransfer.getData("text/uri-list")||e.dataTransfer.getData("text/plain")||"").split("\n")[0].trim());
    if(u){target(owner).photos.push({url:u,cap:""});msg="사진을 붙였어요. '저장'을 눌러야 남아요.";markDirty();}
    else{msg="놓은 것에서 사진을 찾지 못했어요.";render();}
  });

  /* ── 저장: data.json을 GitHub에 커밋 ── */
  async function verifyToken(tk){
    errMsg="키를 확인하는 중…";render();
    var old=token;token=tk;
    try{var r=await gh(FILE);
      if(r.ok){sha=(await r.json()).sha;try{localStorage.setItem(TK,tk);}catch(e){}ui.panel=false;errMsg="";msg="편집 모드를 켰어요.";load();return;}
      errMsg=r.status===401?"키가 올바르지 않아요. 복사할 때 앞뒤가 잘리지 않았는지, 만료되지 않았는지 확인해 주세요.":
        "이 키로는 "+OWNER+"/"+REPO+" 저장소를 열 수 없어요. 키를 만들 때 Repository access에서 이 저장소를 골랐는지 확인해 주세요. ("+r.status+")";
    }catch(e){errMsg="GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";}
    token=old;ui.panel=true;render();
  }
  async function ghMsg(r){try{var j=await r.json();return j&&j.message?j.message:"";}catch(e){return "";}}
  async function save(){
    if(!token)return;saving=true;render();
    saveErr="";
    try{
      for(var attempt=0;attempt<2;attempt++){
        if(!sha||attempt>0){var g=await gh(FILE);if(g.ok){var gj=await g.json();sha=gj.sha;try{adoptAutoLocs(state,JSON.parse(b64dec(gj.content)));}catch(e){}}}
        var body={message:"일정 수정",content:b64enc(JSON.stringify(state,null,1)),branch:BRANCH};if(sha)body.sha=sha;
        var r=await gh(FILE,{method:"PUT",body:JSON.stringify(body)});
        if(r.ok){var j=await r.json();sha=j.content.sha;saved=clone(state);dirty=false;clearDraft();msg="";toast="저장했어요! 다른 기기에는 1~2분 뒤에 보여요.";setTimeout(function(){toast="";render();},4000);
          if(needsResolve(state)){if(!waitIds.length)msg="고덕 링크에서 위치를 찾는 중이에요… 이 화면을 그대로 두면 핀이 자동으로 생겨요.";startPoll();}
          break;}
        if((r.status===409||r.status===422)&&attempt===0)continue;
        var gm=await ghMsg(r);
        saveErr=r.status===401?"저장 키가 올바르지 않거나 만료됐어요. 위의 '편집 모드 끄기'를 누르고 키를 다시 넣어 주세요.":
          (r.status===403||r.status===404)?"저장 키에 쓰기 권한이 없어요. GitHub 키 설정에서 Contents를 'Read and write'로 바꿔 주세요.":
          "저장하지 못했어요";
        saveErr+=" ("+r.status+(gm?" · "+gm:"")+")";break;
      }
    }catch(e){saveErr="GitHub에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";}
    saving=false;render();
  }

  function doPrint(){
    [].forEach.call(document.images,function(i){i.loading="eager";});
    var imgs=[].filter.call(document.images,function(i){return !i.complete;});
    Promise.all(imgs.map(function(i){return new Promise(function(r){i.onload=i.onerror=r;setTimeout(r,4000);});})).then(function(){window.print();});
  }
  load();
})();
</script>
</body>
</html>
